theory:
  classy:
    extra_args:
      output: tCl,pCl,lCl
      l_max_scalars: 3500
      lensing: true
likelihood:
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_2018_lensing.clik: null
params:
  H0:
    prior:
      min: 40
      max: 100
    ref:
      dist: norm
      loc: 67.3
      scale: 2.0
    latex: H_0
  omega_b:
    prior:
      min: 0.01
      max: 0.03
    ref:
      dist: norm
      loc: 0.022
      scale: 0.0005
    latex: \omega_b
  omega_cdm:
    prior:
      min: 0.05
      max: 0.2
    ref:
      dist: norm
      loc: 0.12
      scale: 0.01
    latex: \omega_c
  tau_reio:
    prior:
      min: 0.01
      max: 0.15
    ref:
      dist: norm
      loc: 0.055
      scale: 0.01
    latex: \tau
  ln_A_s_1e10:
    prior:
      min: 2.0
      max: 4.0
    ref:
      dist: norm
      loc: 3.05
      scale: 0.1
    latex: \ln(10^{10} A_s)
  n_s:
    prior:
      min: 0.9
      max: 1.1
    ref:
      dist: norm
      loc: 0.965
      scale: 0.02
    latex: n_s
sampler:
  mcmc:
    max_samples: 20
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.02
    learn_proposal: true
    learn_proposal_Rminus1_min: 0.2
    covmat: ./cobaya_packages/data/planck_supp_data_and_covmats/covmats/base_plikHM_TTTEEE_lowl_lowE_lensing.covmat
output: planck_tttee
