output: my_mpi_chains/planck_tttee
"n_MPI_nodes": 4,   # Number of MPI processes
# 'no_mpi' : True,
    
# in bash do:
# export CLIK_PATH=/workspaces/cosmo-codespace/cobaya_packages/data/planck_2018/baseline
# run with: 
# python -m cobaya.run -r planck_tttee.yaml

sampler:
  mcmc:
    max_samples: 20000 #20000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.02
    learn_proposal: true
    learn_proposal_Rminus1_min: 0.2
    drag: true
    #oversample_power: 0.2
    covmat: ../cobaya_packages/data/planck_supp_data_and_covmats/covmats/base_plikHM_TTTEEE_lowl_lowE_lensing.covmat
    #covmat: ./cobaya_packages/data/planck_supp_data_and_covmats/covmats/base_plikHM_TTTEEE_lowl_lowE_lensing.covmat
    #covmat: auto

likelihood:
  planck_2018_highl_plik.TTTEEE: null
    #clik_file: baseline/plc_3.0/hi_l/plik/plik_rd12_HM_v22b_TTTEEE.clik
    #clik_file: baseline/plc_3.0/hi_l/plik/plik_rd12_HM_v22b_TTTEEE.clik
    #clik_file: camspec_v12_TTTEEE.clik
  planck_2018_lowl.TT: null #clik_file: baseline/plik_rd12_HM_v22b_TT.clik
  planck_2018_lowl.EE: null #
       #clik_file: baseline/simall_100x143_offdiag_EE_Aplanck_B.clik
  planck_2018_lensing.clik: null
       #clik_file: baseline/plc_3.0/lensing/smicadx12_Dec5_ftl_mv2_ndclpp_p_teb_consext8.clik_lensing


theory:
  classy:
    extra_args:
      output: tCl,pCl,lCl
      l_max_scalars: 3500
      lensing: yes
      non linear: hmcode
      N_ncdm: 1
      N_ur: 2.0328

params:
 # --- Neutrino Parameters (Sampled Mass) ---
  m_ncdm:
    prior:
      min: 0.06
      max: 1.0
    ref:
      dist: norm
      loc: 0.06
      scale: 0.01
    proposal: 0.01
    latex: \sum m_\nu \, [\mathrm{eV}]

  M_nu:
    derived: 'lambda m_ncdm: m_ncdm'
    latex: \sum m_\nu \, [\mathrm{eV}]
    
  # Replace 'theta_s_100' with 'theta' (or 100*theta_s)
  theta:
    prior:
      min: 0.5
      max: 1.5
    ref:
      dist: norm
      loc: 1.0411
      scale: 0.0004
    proposal: 0.0004
    latex: 100\theta_{\mathrm{s}}
    drop: true
  # Derive theta_s_100 for classy if needed
  theta_s_100:
    value: 'lambda theta: theta'
    derived: true
  H0:
    latex: H_0
  omega_b:
    prior:
      min: 0.01
      max: 0.03
    ref:
      dist: norm
      loc: 0.022
      scale: 0.0005
    latex: \omega_b
  omega_cdm:
    prior:
      min: 0.05
      max: 0.2
    ref:
      dist: norm
      loc: 0.12
      scale: 0.01
    latex: \omega_c
  tau_reio:
    prior:
      min: 0.01
      max: 0.8
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.05
      scale: 0.01
    proposal: 0.02
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
    #derived: false
  n_s:
    prior:
      min: 0.9
      max: 1.1
    ref:
      dist: norm
      loc: 0.965
      scale: 0.02
    latex: n_s
  Omega_m:
    latex: \Omega_\mathrm{m}
  omegamh2:
    derived: 'lambda Omega_m, H0: Omega_m*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  YHe:
    latex: Y_\mathrm{P}
  z_reio:
    latex: z_\mathrm{re}
  sigma8:
    latex: \sigma_8
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  s8omegamp5:
    derived: 'lambda sigma8, Omega_m: sigma8*Omega_m**0.5'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  s8omegamp25:
    derived: 'lambda sigma8, Omega_m: sigma8*Omega_m**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  A:
    derived: 'lambda A_s: 1e9*A_s'
    latex: 10^9 A_\mathrm{s}
  clamp:
    derived: 'lambda A_s, tau_reio: 1e9*A_s*np.exp(-2*tau_reio)'
    latex: 10^9 A_\mathrm{s} e^{-2\tau}
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
  rs_drag:
    latex: r_\mathrm{drag}
  A_planck:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.0025
    ref:
      dist: norm
      loc: 1.0
      scale: 0.002
    proposal: 0.002
    latex: y_\mathrm{cal}


