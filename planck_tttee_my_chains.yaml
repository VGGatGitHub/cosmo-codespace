output: my_mpi_chains/planck_tttee
"n_MPI_nodes": 4,   # Number of MPI processes
    #'no_mpi' : True,
    
# in bash do:
# export CLIK_PATH=/workspaces/cosmo-codespace/cobaya_packages/data/planck_2018/baseline
# run with: 
# python -m cobaya.run -r planck_tttee.yaml

sampler:
  mcmc:
    max_samples: 20 #000 #20000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.02
    learn_proposal: true
    learn_proposal_Rminus1_min: 0.2
    drag: true
    #oversample_power: 0.2
    covmat: baseline/plc_3.0/covmat/base_plikHM_TTTEEE_lowl_lowE_lensing.covmat
    #covmat: auto

likelihood:
  planck_2018_highl_plik.TTTEEE: null
    #clik_file: baseline/plc_3.0/hi_l/plik/plik_rd12_HM_v22b_TTTEEE.clik
    #clik_file: camspec_v12_TTTEEE.clik
  planck_2018_lowl.TT: null #plik_rd12_HM_v22b_TT.clik
  planck_2018_lowl.EE: null #plik_rd12_HM_v22b_EE.clik
  planck_2018_lensing.clik: null 


theory:
  classy:
    extra_args:
      output: tCl,pCl,lCl
      l_max_scalars: 3500
      lensing: yes

params:
  H0:
    prior:
      min: 40
      max: 100
    ref:
      dist: norm
      loc: 67.3
      scale: 2.0
    latex: H_0
  omega_b:
    prior:
      min: 0.01
      max: 0.03
    ref:
      dist: norm
      loc: 0.022
      scale: 0.0005
    latex: \omega_b
  omega_cdm:
    prior:
      min: 0.05
      max: 0.2
    ref:
      dist: norm
      loc: 0.12
      scale: 0.01
    latex: \omega_c
  tau_reio:
    prior:
      min: 0.01
      max: 0.15
    ref:
      dist: norm
      loc: 0.055
      scale: 0.01
    latex: \tau
  ln_A_s_1e10:
    prior:
      min: 2.0
      max: 4.0
    ref:
      dist: norm
      loc: 3.05
      scale: 0.1
    latex: \ln(10^{10} A_s)
    #derived: false
  n_s:
    prior:
      min: 0.9
      max: 1.1
    ref:
      dist: norm
      loc: 0.965
      scale: 0.02
    latex: n_s

